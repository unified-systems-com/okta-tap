manifest_version = "0"
plugin_version = "0.1.0"
requires_tap = ">=0.2.2"
slug = "okta"
name = "TAP Okta"
description = "Okta workforce identity as grid vocabulary: the org and the objects a FedRAMP operator answers for in it (users, groups, applications, authorization servers, identity providers, authenticators, policies, network zones, admin roles, API tokens, devices, log streams), with an org page."

# Vocabulary dependency (add-edge, cross-plugin endpoints): SERVES_ISSUER__okta targets identity_core's
# neutral OIDC issuer, an OIDC identity provider reaches its issuer by identity_core's own
# TRUSTS_ISSUER__identity_core, and an Okta user is held by identity_core's human
# (HELD_BY_HUMAN__identity_core, declared in OktaUser.OUTBOUND_EDGES). No Python import; install +
# migrate order only.
# computing_core is the same kind of dependency: the device record declares its REPRESENTS_HOST to the
# neutral host (req-okta-host-link).
depends_on = [
    { slug = "identity_core", min_version = "0.1.3", note = "Vocabulary dependency: SERVES_ISSUER__okta targets identity_core__oidc_issuer, the neutral issuer a relying service's TRUSTS_ISSUER edge also lands on; okta__okta_user declares HELD_BY_HUMAN__identity_core to identity_core__human, the one person every system's account resolves to." },
    { slug = "computing_core", note = "Vocabulary dependency: okta__okta_device declares REPRESENTS_HOST__computing_core to computing_core__host, the neutral machine every vendor device record converges on. No min_version until a computing_core release carries host." },
]

# Pure Python, no dependencies, no crypto (spec-fips.md, req-tap-plugin-manifest-v0-fips).
[fips]
status = "compatible"

